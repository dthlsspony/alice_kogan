services:
  mariadb:
    image: mariadb:11.4
    container_name: kogan_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: kogan
      MARIADB_USER: kogan
      MARIADB_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 30

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kogan_php
    volumes:
      - ./src:/var/www/html
      - ./legacy:/var/www/legacy:ro
    depends_on:
      mariadb:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: kogan_nginx
    ports:
      - "8091:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

volumes:
  mariadb_data:
